spring:
  application:
    name: GestaoDeCustos

  datasource:
    url: jdbc:mysql://localhost:3307/gestao_custos?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
